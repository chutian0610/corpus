name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Tauri Linux 系统依赖（桌面 crate 编译需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查
        run: cargo fmt --all --check
      - name: Clippy（零警告门禁）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 测试（默认 feature 集，含桌面 / server / 引擎）
        run: cargo test --workspace
      - name: 测试（引擎脱离 rig feature——LLM 端口 Fake 路径）
        run: cargo test -p corpus-engine --no-default-features

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: 类型检查 + 构建
        working-directory: apps/desktop
        run: pnpm build
